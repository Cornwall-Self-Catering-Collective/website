local_backend: true

# Replace this repository before enabling the CMS in production.
backend:
  name: github
  repo: cornwall-self-catering-collective/website
  branch: main
  sitedomain: cornwall-self-catering-collective.netlify.app

media_folder: public/assets/uploads
public_folder: /assets/uploads

site_url: https://cornwallselfcateringcollective.co.uk
display_url: https://cornwallselfcateringcollective.co.uk
logo_url: /assets/images/cornwall-self-catering-collective-logo.png

collections:
  - name: pages
    label: Pages
    files:
      - label: Homepage
        name: homepage
        file: src/content/homepage/index.md
        fields:
          - { label: Page title, name: pageTitle, widget: string }
          - { label: SEO description, name: seoDescription, widget: text }
          - { label: Hero eyebrow, name: heroEyebrow, widget: string }
          - { label: Hero heading, name: heroHeading, widget: string }
          - { label: Mission eyebrow, name: missionEyebrow, widget: string }
          - { label: Mission heading, name: missionHeading, widget: string }
          - { label: Mission paragraph one, name: missionParagraphOne, widget: text }
          - { label: Mission paragraph two, name: missionParagraphTwo, widget: text }
      - label: About us
        name: about
        file: src/content/about/index.md
        fields:
          - { label: Page title, name: pageTitle, widget: string }
          - { label: SEO description, name: seoDescription, widget: text }
          - { label: Hero eyebrow, name: heroEyebrow, widget: string }
          - { label: Hero heading, name: heroHeading, widget: string }
          - { label: Intro paragraph one, name: introParagraphOne, widget: text }
          - { label: Intro paragraph two, name: introParagraphTwo, widget: text }
          - { label: Stand for heading, name: standForHeading, widget: string }
          - label: Stand for items
            name: standForItems
            widget: list
            field: { label: Item, name: item, widget: string }
  - name: articles
    label: Articles
    label_singular: Article
    folder: src/content/articles
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{order}}. {{title}}"
    sortable_fields: [order, title, category]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Category, name: category, widget: string }
      - { label: Summary, name: excerpt, widget: text }
      - label: Display order
        name: order
        widget: number
        value_type: int
        min: 1
      - { label: Published, name: published, widget: boolean, default: true }
      - { label: Article content, name: body, widget: markdown }
